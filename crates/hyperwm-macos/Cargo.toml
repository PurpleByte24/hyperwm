[package]
name = "hyperwm-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS integration: CGEventTap hyperkey watcher and Accessibility API window manipulation. Implemented in build units 3-4."

[dependencies]
accessibility-sys = "0.2"
block2 = "0.6.2"
core-foundation = "0.10"
core-graphics = "0.25"
hyperwm-core = { path = "../hyperwm-core" }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "NSWorkspace", "NSRunningApplication", "libc", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSNotification", "NSGeometry", "NSObject", "NSString", "NSArray", "NSDictionary", "NSOperation", "block2"] }
