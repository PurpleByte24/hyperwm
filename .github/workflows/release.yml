# Builds a universal (arm64 + x86_64) macOS release binary and attaches it
# to a GitHub release whenever a "vX.Y.Z" tag is pushed. This repo mirrors
# from a private self-hosted Gitea to GitHub specifically so this workflow
# (and the separate homebrew-hyperwm tap, which only exists on GitHub) can
# run here -- see docs/installation.md and README.md for the release/
# Homebrew story this feeds.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    # GitHub-hosted macOS runners are arm64 by default; the x86_64 slice
    # below is built by cross-compiling from here via an added rustup
    # target, not a second runner.
    runs-on: macos-14
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set crate version from tag
        # workspace.package.version in the root Cargo.toml is what
        # env!("CARGO_PKG_VERSION") embeds into `hyperwm --version`/--help
        # at compile time -- stamp it from the pushed tag here so the
        # shipped binary always matches the release, instead of relying on
        # Cargo.toml having been bumped by hand before tagging.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i '' -E "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          grep '^version' Cargo.toml

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (aarch64-apple-darwin)
        run: cargo build --workspace --release --target aarch64-apple-darwin

      - name: Build (x86_64-apple-darwin)
        run: cargo build --workspace --release --target x86_64-apple-darwin

      - name: Combine into universal binaries
        # `lipo -create` concatenates the two independently ad-hoc-signed
        # per-arch slices without producing a coherent signature over the
        # combined fat file -- `codesign -dv` on the result still prints
        # signature-looking metadata (stale, from one slice), but
        # `codesign --verify --deep --strict` correctly calls it "not
        # signed at all". Ad-hoc-signed CLI tools like this one (no
        # Developer ID, no bundle) get identified in TCC's grant database
        # by this signature -- an unsigned binary has none, so
        # AXIsProcessTrustedWithOptions/CGRequestListenEventAccess report
        # false for it even with a valid Accessibility/Input Monitoring
        # grant on file, when launched via launchd (a plain interactive
        # shell exec is more permissive and doesn't surface this). Signing
        # the combined binary after lipo, not just each slice before it,
        # is required.
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in hyperwm hyperwm-daemon; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            chmod +x "dist/$bin"
            codesign --force --sign - --options runtime "dist/$bin"
            codesign --verify --deep --strict --verbose=2 "dist/$bin"
            lipo -info "dist/$bin"
          done

      - name: Package release tarball
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="hyperwm-${version}-macos-universal.tar.gz"
          tar -czf "$tarball" -C dist hyperwm hyperwm-daemon
          shasum -a 256 "$tarball" > "$tarball.sha256"
          sha256="$(cut -d' ' -f1 "$tarball.sha256")"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$TARBALL" "$TARBALL.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  update-homebrew-tap:
    # Keeps PurpleByte24/homebrew-hyperwm's Formula/hyperwm.rb in sync with
    # each release, so it no longer needs to be hand-edited (new sha256,
    # url, commit, push) after every tag. Needs a token with write access
    # to that *separate* repo -- the default GITHUB_TOKEN above is scoped
    # to this repo only. See docs/installation.md for the tap's role.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out homebrew-hyperwm
        uses: actions/checkout@v4
        with:
          repository: PurpleByte24/homebrew-hyperwm
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          sha256="${{ needs.release.outputs.sha256 }}"
          url="https://github.com/${{ github.repository }}/releases/download/v${version}/hyperwm-${version}-macos-universal.tar.gz"
          formula="tap/Formula/hyperwm.rb"

          sed -i -E "s|^(  url \")[^\"]*(\")|\1${url}\2|" "$formula"
          sed -i -E "s|^(  sha256 \")[^\"]*(\")|\1${sha256}\2|" "$formula"

          grep -qF -- "$url" "$formula" || {
            echo "::error::couldn't find/update the 'url' line in $formula -- check its format matches a standard 'brew create'-style formula" >&2
            exit 1
          }
          grep -qF -- "$sha256" "$formula" || {
            echo "::error::couldn't find/update the 'sha256' line in $formula" >&2
            exit 1
          }
          grep -E '^  (url|sha256) ' "$formula"

      - name: Commit and push
        working-directory: tap
        env:
          GIT_AUTHOR_NAME: hyperwm-release-bot
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: hyperwm-release-bot
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail
          git add Formula/hyperwm.rb
          if git diff --cached --quiet; then
            echo "formula already up to date, nothing to commit"
            exit 0
          fi
          git commit -m "hyperwm ${{ needs.release.outputs.version }}"
          git push
